<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de familiar — ZELO</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="topbar"><div class="topbar-inner"><a href="index.html" class="logo">ZELO</a></div></header>
<main class="container">
    <div class="auth-wrap" style="max-width:520px">
        <h1>Cadastro — Familiar</h1>
        <p class="subtitle" style="text-align:center">Crie sua conta para acompanhar o desenvolvimento do seu filho ou filha</p>

        <form onsubmit="event.preventDefault(); window.location.href='familiar/home.html';">
            <div><label>Nome completo</label><input type="text" name="nome" required></div>
            <div><label>E-mail</label><input type="email" name="email" required></div>
            <div><label>Senha</label><input type="password" name="senha" required minlength="6"></div>
            <div><label>Confirmar senha</label><input type="password" name="confirmar_senha" required minlength="6"></div>
            <div><label>CPF</label><input type="text" name="cpf" inputmode="numeric" maxlength="11" pattern="[0-9]{11}" title="Digite os 11 números do CPF, sem pontos, traços ou letras" placeholder="Somente números"></div>
            <div><label>Telefone</label><input type="text" name="telefone"></div>
            <hr style="border-color:var(--border)">
            <div><label>Nome do filho(a)</label><input type="text"></div>
            <div><label>Idade do filho(a)</label><input type="text"></div>
            <div><label>Diagnóstico (opcional)</label><input type="text"></div>
            <button class="btn" type="submit">Criar conta</button>
        </form>

        <div class="auth-links">Já tem conta? <a href="index.html">Entrar</a></div>
    </div>
</main>
<footer class="footer"><p>ZELO Web &mdash; apoio à saúde para famílias de crianças atípicas</p></footer>
</body>
</html>

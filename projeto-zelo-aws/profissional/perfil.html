<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu perfil — ZELO</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="theme-pro">
<header class="topbar">
    <div class="topbar-inner">
        <a href="home.html" class="logo"><img src="../assets/img/zelo-icon.png" alt="" class="brand-icon"> ZELO</a>
        <nav class="nav">
            <a href="home.html">Início</a>
            <a href="agenda.html">Agenda</a>
            <a href="perfil.html">Meu perfil</a>
            <span class="user-name">Camila Ferreira</span>
            <a href="../index.html" class="btn-sair">Sair</a>
        </nav>
    </div>
</header>
<main class="container">
    <div class="card card-person" style="margin-bottom:24px">
        <div class="avatar avatar-purple" style="width:64px;height:64px;font-size:22px">🖐️</div>
        <div>
            <h1 style="margin:0 0 4px">Camila Ferreira</h1>
            <p class="subtitle" style="margin:0">Terapia Ocupacional · CREFITO 12/34567</p>
        </div>
    </div>

    <h2>Painel de relatório</h2>
    <div class="grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr))">
        <div class="card stat-card">
            <div class="stat-icon stat-icon-blue">📅</div>
            <div>
                <div class="stat-number">24</div>
                <div class="stat-label">Consultas este mês</div>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon stat-icon-green">💰</div>
            <div>
                <div class="stat-number">R$ 3.840</div>
                <div class="stat-label">Faturamento no mês</div>
            </div>
        </div>
        <div class="card stat-card">
            <div class="stat-icon stat-icon-purple">📊</div>
            <div>
                <div class="stat-number">187</div>
                <div class="stat-label">Consultas no total</div>
            </div>
        </div>
    </div>

    <h2 style="margin-top:32px">Editar perfil</h2>
    <form class="card" onsubmit="event.preventDefault(); alert('Perfil atualizado (demonstração visual).');">
        <div><label>Anos de experiência</label><input type="text" value="8"></div>
        <div><label>Valor da consulta</label><input type="text" value="R$ 160,00"></div>
        <div>
            <label>Modalidades</label>
            <div class="form-row">
                <label><input type="checkbox" checked> Online</label>
                <label><input type="checkbox" checked> Presencial</label>
                <label><input type="checkbox" checked> Grupo</label>
            </div>
        </div>
        <div><label>Bio</label><textarea>Especialista em integração sensorial e desenvolvimento infantil, com foco em autonomia e qualidade de vida para crianças atípicas e suas famílias.</textarea></div>
        <button class="btn" type="submit">Salvar alterações</button>
    </form>
</main>
<footer class="footer"><p>ZELO Web &mdash; apoio à saúde para famílias de crianças atípicas</p></footer>
</body>
</html>
